<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Your Name | Web Developer and Creative Designer</title>
  <meta name="description"
    content="Portfolio of Your Name, a web developer and creative designer. See desktop and mobile project work and get in touch.">
  <meta name="theme-color" content="#0F292F">
  <link rel="canonical" href="https://example.com/">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Your Name | Web Developer and Creative Designer">
  <meta property="og:description" content="Scroll through desktop and mobile project work.">
  <meta property="og:url" content="https://example.com/">
  <meta property="og:image" content="https://example.com/assets/project-preview.webp">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/script.js" defer></script>
</head>

<body>
  <main>

    <header class="hero" id="profile">
      <img class="hero__photo" src="assets/profile.png" width="600" height="600" alt="Portrait of Your Name">
      <div class="hero__text">
        <p class="hero__label">Web Developer &amp; Creative Designer</p>
        <h1>Your Name</h1>
        <p class="hero__intro">
          <span>I build fast, accessible websites for small teams and brands.</span>
          <span>I care about clear layout, honest motion and clean code.</span>
          <span>Scroll down to see my work.</span>
        </p>
      </div>
    </header>

    <section class="showcase showcase--desktop" id="desktop-projects" aria-labelledby="desk-title">
      <div class="stage">
        <h2 id="desk-title" class="stage__title">Desktop project</h2>
        <div class="monitor" aria-hidden="true"></div>
        <div class="shot"><img src="assets/project-preview.png" width="1600" height="1000"
            alt="Screenshot of the project homepage shown on a desktop screen" loading="lazy"></div>
      </div>
    </section>

    <section class="showcase showcase--mobile" id="mobile-projects" aria-labelledby="mob-title">
      <div class="stage">
        <h2 id="mob-title" class="stage__title">Mobile project</h2>
        <div class="phone">
          <div class="phone__screen">
            <div class="phone__img"><img src="assets/mobile-preview.jpeg" width="1600" height="1000"
                alt="The same project shown on a phone screen" loading="lazy"></div>
          </div>
        </div>
      </div>
    </section>

    <section class="contact" id="contact" aria-labelledby="contact-title">
      <h2 id="contact-title">Contact</h2>
      <div class="contact__grid">
        <ul class="links reveal">
          <!-- Replace the placeholder URLs and email below -->
          <li><a href="https://github.com/your-username" target="_blank" rel="noopener noreferrer"
              aria-label="GitHub profile (opens in a new tab)"><svg viewBox="0 0 24 24" aria-hidden="true">
                <path
                  d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 0 0-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0 0 20 4.77 5.07 5.07 0 0 0 19.91 1S18.73.65 16 2.48a13.38 13.38 0 0 0-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 0 0 5 4.77a5.44 5.44 0 0 0-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 0 0 9 18.13V22" />
              </svg><span>GitHub</span></a></li>
          <li><a href="mailto:hello@example.com" aria-label="Send an email"><svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M4 4h16a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z" />
                <path d="m22 6-10 7L2 6" />
              </svg><span>Email</span></a></li>
          <li><a href="https://www.linkedin.com/in/your-username" target="_blank" rel="noopener noreferrer"
              aria-label="LinkedIn profile (opens in a new tab)"><svg viewBox="0 0 24 24" aria-hidden="true">
                <path
                  d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-4 0v7h-4v-7a6 6 0 0 1 6-6zM2 9h4v12H2zM4 2a2 2 0 1 1 0 4 2 2 0 0 1 0-4z" />
              </svg><span>LinkedIn</span></a></li>
        </ul>

        <!-- Set data-endpoint to your form service URL (see README). Empty = demo mode. -->
        <form class="form reveal" id="contact-form" data-endpoint="" novalidate>
          <label for="f-name">Full name</label>
          <input id="f-name" name="name" type="text" autocomplete="name" required minlength="2" maxlength="80">
          <label for="f-email">Email address</label>
          <input id="f-email" name="email" type="email" autocomplete="email" required maxlength="120">
          <label for="f-subject">Subject</label>
          <input id="f-subject" name="subject" type="text" required minlength="3" maxlength="120">
          <label for="f-message">Message</label>
          <textarea id="f-message" name="message" rows="5" required minlength="10" maxlength="2000"></textarea>
          <input class="form__trap" name="website" type="text" tabindex="-1" autocomplete="off" aria-hidden="true">
          <button type="submit">Send message</button>
          <p class="form__status" role="status" aria-live="polite"></p>
        </form>
      </div>
  </main>
  <footer class="footer">
    <p>&copy; <span id="year">2026</span> Your Name</p>
  </footer>
</body>

</html>
